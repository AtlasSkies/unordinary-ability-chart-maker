<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnOrdinary Ability Chart Maker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
  <div class="container">

    <!-- ── SIDEBAR ── -->
    <div class="left">

      <!-- Header -->
      <div class="header-with-info">
        <div class="title-block">
          <h1>UnOrdinary Ability Chart Maker</h1>
          <div class="subtitle">
            By Atlas Skies
            <div class="info-container">
              <span class="info-icon">ℹ️</span>
              <div class="tooltip">
                Credit to Atlas Skies would be greatly appreciated, but not necessary.<br>
                If you're Uru-Chan, I love the comic — feel free to use this, lol.
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Image upload -->
      <div class="sidebar-section">
        <input type="file" accept="image/*" id="imgInput" />
        <img id="uploadedImg" class="upload-img" alt="Uploaded Image" />
      </div>

      <!-- Character info -->
      <div class="sidebar-section">
        <div class="info-box">
          <label><b>Name</b>    <input type="text" id="nameInput"    placeholder="—" /></label>
          <label><b>Ability</b> <input type="text" id="abilityInput" placeholder="—" /></label>
          <label><b>Level</b>   <input type="text" id="levelInput"   placeholder="—" /></label>
        </div>
      </div>

      <!-- Character description -->
      <div class="sidebar-section">
        <label class="desc-label"><b>Description</b></label>
        <textarea id="charDescInput" placeholder="Enter character description…" rows="3"></textarea>
      </div>

      <!-- Stats -->
      <div class="sidebar-section">
        <div class="inputs">
          <label>Power    <input type="number" id="powerInput"    step="0.1" min="0" placeholder="0" /></label>
          <label>Speed    <input type="number" id="speedInput"    step="0.1" min="0" placeholder="0" /></label>
          <label>Trick    <input type="number" id="trickInput"    step="0.1" min="0" placeholder="0" /></label>
          <label>Recovery <input type="number" id="recoveryInput" step="0.1" min="0" placeholder="0" /></label>
          <label>Defense  <input type="number" id="defenseInput"  step="0.1" min="0" placeholder="0" /></label>
          <label>Color    <input type="color"  id="colorPicker"   value="#92dfec" /></label>
        </div>
      </div>

      <!-- Multi-color -->
      <div class="sidebar-section">
        <button id="multiColorBtn">Multi-color</button>
        <div id="axisColors">
          <label>Power    <input type="color" id="powerColor"    value="#92dfec" /></label>
          <label>Speed    <input type="color" id="speedColor"    value="#92dfec" /></label>
          <label>Trick    <input type="color" id="trickColor"    value="#92dfec" /></label>
          <label>Recovery <input type="color" id="recoveryColor" value="#92dfec" /></label>
          <label>Defense  <input type="color" id="defenseColor"  value="#92dfec" /></label>
        </div>
      </div>

      <!-- Chart controls -->
      <div class="sidebar-section">
        <button id="addChartBtn">＋ Add Chart</button>
        <div id="chartButtons"></div>
      </div>

      <!-- View / Random -->
      <div class="sidebar-section">
        <button id="viewBtn">View Character Chart</button>
        <button id="charDescBtn">Character Description</button>
        <button onclick="window.open('https://atlasskies.github.io/unordinary-random-ability-chart/', '_blank')">⚄ Random Chart</button>
      </div>

    </div><!-- end .left -->

    <!-- ── CHART AREA ── -->
    <div class="chart-area" id="chartArea"></div>

  </div><!-- end .container -->

  <!-- ── POPUP OVERLAY ── -->
  <div id="overlay" class="overlay hidden">
    <div id="characterBox" class="character-box">
      <button id="closeBtn" class="close-btn">×</button>

      <div class="image-section">
        <div class="overlay-img-wrap">
          <img id="overlayImg" class="overlay-img" alt="Character Image" />
          <div class="img-watermark">AS</div>
        </div>
        <div class="text-box">
          <div><b>Name:</b> <span id="overlayName">-</span></div>
          <div><b>Ability:</b> <span id="overlayAbility">-</span></div>
          <div><b>Level:</b> <span id="overlayLevel">-</span></div>
        </div>
      </div>

      <div class="overlay-chart">
        <canvas id="overlayChartCanvas"></canvas>
      </div>

      <button id="downloadBtn">⬇ Download Chart</button>
      <button id="downloadGifBtn">⬡ Download GIF</button>
    </div>
  </div>

  <script src="gif_encoder.js"></script>
  <script src="script.js"></script>

  <!-- ── CHARACTER DESCRIPTION OVERLAY ── -->
  <div id="descOverlay" class="overlay hidden">
    <div id="descBox" class="desc-box">
      <button id="descCloseBtn" class="close-btn">×</button>

      <!-- Left: character image with mini chart overlaid -->
      <div class="desc-left">
        <div class="desc-img-wrap">
          <img id="descImg" class="desc-img" alt="Character" />
          <!-- Mini radar overlaid on bottom of image -->
          <div class="desc-mini-chart">
            <canvas id="descChartCanvas"></canvas>
          </div>
        </div>
      </div>

      <!-- Right: ability info + description, white border box -->
      <div class="desc-right">
        <div class="desc-info-border">
          <div class="desc-ability-block">
            <p class="desc-ability-line">Ability: <em id="descAbility">—</em></p>
            <p class="desc-ability-line">Level: <em id="descLevel">—</em></p>
          </div>
          <p id="descText" class="desc-text"></p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
